name: Mint the cards

# Turns the season into cards and commits them. See tools/MINT.md.
#
# Tuesday, after "Archive the week" has settled the week just played (Tue 10:20 MT) — moment and
# player cards are built from that archive, so minting before it lands would mint an empty week.
# ESPN is read live for the franchise and crown/clown cards.
#
# It never posts anything. The only thing it changes is cards/collection/, and it only commits
# when something in there actually differs — a week with no new games leaves no commit behind.
#
# Times are UTC. Mountain is UTC-6 in season (MDT).

on:
  schedule:
    - cron: '5 17 * * 2'      # Tue 11:05 MT, ~45 min after the week is settled
  workflow_dispatch:
    inputs:
      week:
        description: 'NFL week to mint ("all" for every archived week)'
        required: false
        default: 'all'

# Two mints at once would both write cards/collection and one would lose its push.
concurrency:
  group: crownorclown-mint
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The mint writes files that get committed and served to people. If the card logic is
      # broken, the right outcome is a red run and yesterday's cards, not fresh broken ones.
      - name: Test the mint
        run: node tools/mint.test.mjs

      - name: Mint
        run: node tools/mint.mjs --week "${{ github.event.inputs.week || 'all' }}"

      - name: Commit anything new
        run: |
          git config user.name  "crownorclown-bot"
          git config user.email "bot@crownorclown.com"
          git add cards/collection
          if git diff --cached --quiet; then
            echo "no new cards"
            exit 0
          fi
          git commit -m "Mint the cards: $(date -u +%Y-%m-%d)"
          # "Archive the week" pushes to the same branch and is not in this concurrency group,
          # so a push can lose a race it did nothing wrong in. Rebase and try again rather than
          # failing a run that produced perfectly good cards.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
            sleep $((i * 5))
          done
          exit 1

      - name: Say what it minted
        if: always()
        run: |
          echo "### Cards" >> "$GITHUB_STEP_SUMMARY"
          if [ -f cards/collection/collection.json ]; then
            node -e '
              const d = require("./cards/collection/collection.json");
              console.log("**" + d.total + " cards** in the " + d.season + " collection\n");
              for (const [k, v] of Object.entries(d.counts)) console.log("- " + k + ": " + v);
            ' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The mint produced nothing." >> "$GITHUB_STEP_SUMMARY"
          fi
