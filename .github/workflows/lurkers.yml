name: Lurker instigator

# Finds managers who joined the Discord but never posted an intro card or a trade block, and ribs
# a rotating few by name to go do it. Reads the live guild roster and the intro/trade-block posts
# (which already carry each poster's id) — no member database, Discord is the record.
#
# Idle until DISCORD_BOT_TOKEN is added as a repo secret AND Server Members Intent is toggled on
# in the Discord developer portal; until then every run exits quietly having posted nothing.
#
# Every day, at an off-:00 minute (GitHub throttles top-of-hour crons), plus a random slide so it
# lands at a different time each day instead of on a visible clock. Mountain is UTC-6 in season; the
# tool itself holds during quiet hours (before 8am / after 10pm MT) so nobody gets poked overnight.

on:
  schedule:
    - cron: '41 18 * * *'  # daily ~12:41 MT + jitter — midday, people around, nothing else on
    - cron: '7 1 * * *'    # daily ~19:07 MT + jitter — evening, off work and on their phones
  workflow_dispatch:
    inputs:
      dry:
        description: 'Print who would be ribbed without posting'
        type: boolean
        required: false
        default: true
      kickstart:
        description: 'One-time launch blast: name everyone without a card and lay out the ask'
        type: boolean
        required: false
        default: false

jobs:
  instigate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Slide the daily run by a random 0-75 min so it doesn't land at the same minute every day.
      - name: Organic jitter
        if: github.event_name == 'schedule'
        run: sleep $(( (RANDOM % 76) * 60 ))
      - name: Run the instigator
        env:
          DISCORD_BOT_TOKEN:     ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID:      ${{ secrets.DISCORD_GUILD_ID }}
          PULSE_WEBHOOK_GENERAL: ${{ secrets.PULSE_WEBHOOK_GENERAL }}
        run: |
          FLAG=""
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then FLAG="--dry"; fi
          if [ "${{ github.event.inputs.kickstart }}" = "true" ]; then FLAG="$FLAG --kickstart"; fi
          node tools/lurkers.mjs $FLAG
