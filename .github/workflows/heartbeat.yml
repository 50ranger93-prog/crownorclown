name: Channel heartbeat

# The daytime pulse. Wakes a handful of times through the day — NOT at night, and NOT on the
# top of the hour — but does not post every time: the script rolls the dice (PULSE_FIRE_RATE), so
# something lands at a time nobody can predict instead of on a visible clock. That's what makes the
# channel feel alive instead of automated. The scheduled beats (pulse.yml) are the anchored posts
# every day; this is the ambient chatter between them.
#
# Cost: this repo is public, so GitHub Actions minutes are free and unlimited — frequency costs
# nothing. The reason it's only seven daytime wakes rather than every-30-min is that nobody wants
# pings while they sleep, not the runner bill.
#
# Times are UTC; Mountain is UTC-6 in season. Roughly 8am–8pm MT, every two hours, at odd minutes.

on:
  schedule:
    # The everyday cadence — ~every 2 hours through the daytime, at odd minutes. This is the
    # "rest of the time" baseline.
    - cron: '13 14 * * *'   #  8:13 MT
    - cron: '47 16 * * *'   # 10:47 MT
    - cron: '21 18 * * *'   # 12:21 MT
    - cron: '8 20 * * *'    #  2:08 MT
    - cron: '39 22 * * *'   #  4:39 MT
    - cron: '52 0 * * *'    #  6:52 MT
    - cron: '26 2 * * *'    #  8:26 MT
    # Gametime windows — wake every ~20 min so the channel can dial up while games are on. These
    # are broad brackets around the NFL slate (times UTC; ET = UTC-4 in season); the script gates
    # every one of them on the LIVE scoreboard, firing only from ~1 hour before a kickoff until the
    # games go final, so they stay quiet the rest of the window. No kickoff times are hardcoded.
    - cron: '*/20 16-23 * * 0'  # Sun 10:00–17:40 MT — early + afternoon games
    - cron: '*/20 0-4 * * 1'    # Sun night → Mon early UTC — Sunday Night Football
    - cron: '*/20 23 * * 4'     # Thu evening lead-in — Thursday Night Football pregame
    - cron: '*/20 0-4 * * 5'    # Thu night → Fri early UTC — Thursday Night Football
    - cron: '*/20 23 * * 1'     # Mon evening lead-in — Monday Night Football pregame
    - cron: '*/20 0-4 * * 2'    # Mon night → Tue early UTC — Monday Night Football
  workflow_dispatch:
    inputs:
      dry:
        description: 'Print without posting'
        type: boolean
        required: false
        default: true

# Two ticks can overlap if one runs long; let the newer one wait rather than double-post.
concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Heartbeat
        env:
          PULSE_WEBHOOK_GENERAL:   ${{ secrets.PULSE_WEBHOOK_GENERAL }}
          PULSE_WEBHOOK_HOTTAKE:   ${{ secrets.PULSE_WEBHOOK_HOTTAKE }}
          DISCORD_BOT_TOKEN:       ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID:        ${{ secrets.DISCORD_GUILD_ID }}
          # Dial: 0 = silent, 1 = fires every waking tick. Default 0.35 ≈ a handful of posts a day.
          PULSE_FIRE_RATE:         ${{ vars.PULSE_FIRE_RATE }}
          DRY: ${{ github.event.inputs.dry }}
        run: |
          FLAG=""
          if [ "$DRY" = "true" ]; then FLAG="--dry"; fi
          node tools/pulse.mjs --heartbeat $FLAG
