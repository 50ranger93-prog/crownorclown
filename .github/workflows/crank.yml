# The daily bot.
#
# Fires every hour from 9am to 8pm Mountain and lets tools/crank.mjs decide whether this
# particular hour is one of today's slots. The day's post count is 3 to 9, derived from the date
# itself, so it varies without anyone storing a plan and the room never learns the rhythm.
#
# The hours below cover Mountain daylight AND standard time, and crank.mjs checks the real
# Mountain hour itself and refuses outside 9am–8pm. Two guards, because the one thing nobody
# forgives is a 3am notification.
#
# Minutes sit off the hour: GitHub throttles top-of-the-hour schedules hard.
#
# Secrets used, all already present: DISCORD_BOT_TOKEN, DISCORD_GUILD_ID. The ledger is written
# with the workflow's own GITHUB_TOKEN, which is why this job asks for contents: write.

name: Crank
on:
  schedule:
    - cron: "19 15-23 * * *"
    - cron: "19 0-3 * * *"
  # GitHub's own scheduler is the weak link: a brand-new cron can take hours to register and free
  # runners drop scheduled runs under load — this repo already documents them landing one to three
  # hours late. So crank also rides on the workflows that demonstrably DO fire here, several times
  # a day, every day. Extra triggers cost nothing: crank.mjs decides for itself whether the hour is
  # inside 9am-8pm Mountain and whether today's count is already met, so a trigger that isn't
  # needed simply prints why and stops.
  workflow_run:
    workflows: ["Channel heartbeat", "Channel pulse", "Archive the week", "Post the week", "Post the polls"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry:
        description: "Print what it would say, post nothing"
        type: boolean
        default: true
      plan:
        description: "Print this many posts in a row to read the variety (implies dry)"
        default: ""
      force:
        description: "Post now regardless of the hour or today's count"
        type: boolean
        default: false
      say:
        description: "Post this exact text as the bot instead of generating one"
        default: ""
      room:
        description: "Channel for --say (general, announcements, trash-talk, ...)"
        default: "general"
      only:
        description: "Fire one kind on demand: bums, poll, roundup, member, news, ref, bunk, faab, benched"
        default: ""

permissions:
  contents: write

# Scheduled runs share one group so two of them can never post at the same moment. Manual runs
# each get their own, because GitHub keeps only ONE pending run per group — fire three by hand and
# the first two are cancelled before they ever start, which is exactly what happened to the first
# announcement and the bums post.
concurrency:
  group: crank-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_run') && 'auto' || github.run_id }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Say something
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOARD_REPO_OWNER: ${{ github.repository_owner }}
          BOARD_REPO: ${{ github.event.repository.name }}
          CRANK_OFF: ${{ vars.CRANK_OFF }}
          CRANK_OPEN: ${{ vars.CRANK_OPEN }}
          CRANK_CLOSE: ${{ vars.CRANK_CLOSE }}
          CRANK_MIN: ${{ vars.CRANK_MIN }}
          CRANK_MAX: ${{ vars.CRANK_MAX }}
          # Passed as environment, never interpolated into the command line. A backtick in the
          # text was being executed by the shell — `/vote` in an announcement tried to run /vote
          # as a program — and anything interpolated straight into a run block is an injection
          # waiting to happen.
          SAY: ${{ inputs.say }}
          ONLY: ${{ inputs.only }}
          ROOM: ${{ inputs.room }}
        run: |
          args=""
          if [ -n "${{ inputs.plan }}" ]; then
            args="--dry --plan ${{ inputs.plan }}"
          elif [ "${{ inputs.dry }}" = "true" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            args="--dry"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then args="$args --force"; fi
          if [ -n "$SAY" ]; then
            node tools/crank.mjs --say "$SAY" --room "${ROOM:-general}" $args
          else
            if [ -n "$ONLY" ]; then args="$args --only $ONLY"; fi
            node tools/crank.mjs $args
          fi
