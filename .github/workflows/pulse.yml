name: Channel pulse

# Keeps the Discord moving on its own. Each beat runs on its own clock and writes to one
# channel; a beat with nothing true to say posts nothing, so quiet weeks stay quiet instead of
# filling up with filler.
#
# Times are UTC. Mountain is UTC-6 in season (MDT).

on:
  schedule:
    # Spread across the whole week at off-:00 minutes (GitHub throttles top-of-hour crons hard).
    # The channel should feel alive most days, not just gameday. Mountain is UTC-6 in season.
    - cron: '22 16 * * 1'  # Mon 10:22 MT — hot take to open the week while last week still stings
    - cron: '8 16 * * 2'   # Tue 10:08 MT — crown and vest for the week just settled
    - cron: '17 16 * * 3'  # Wed 10:17 MT — first injury designations of the week
    - cron: '6 16 * * 4'   # Thu 10:06 MT — FAAB check
    - cron: '40 22 * * 4'  # Thu 16:40 MT — the week's fights, afternoon, before Thursday night kicks it off
    - cron: '14 16 * * 5'  # Fri 10:14 MT — injuries again (Friday is when OUT gets real) + hot take
    - cron: '33 17 * * 6'  # Sat 11:33 MT — the fights again + a take, heading into the weekend
    - cron: '3 15 * * 0'   # Sun 09:03 MT — the slate, before anyone sets a lineup
    - cron: '12 17 * * 0'  # Sun 11:12 MT — inactives, ~90 min before the 1pm ET kicks
  workflow_dispatch:
    inputs:
      beat:
        description: 'Beat to run (slate, inactives, injuries, matchups, crownvest, faab, hottake, or all)'
        required: false
        default: 'all'
      dry:
        description: 'Print without posting'
        type: boolean
        required: false
        default: true

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Which beats fire depends on which cron woke us. On a manual run, do what was asked.
      - name: Decide beats
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            '22 16 * * 1') echo "beats=hottake" >> $GITHUB_OUTPUT ;;
            '8 16 * * 2')  echo "beats=crownvest" >> $GITHUB_OUTPUT ;;
            '17 16 * * 3') echo "beats=injuries" >> $GITHUB_OUTPUT ;;
            '6 16 * * 4')  echo "beats=faab" >> $GITHUB_OUTPUT ;;
            '40 22 * * 4') echo "beats=matchups" >> $GITHUB_OUTPUT ;;
            '14 16 * * 5') echo "beats=injuries hottake" >> $GITHUB_OUTPUT ;;
            '33 17 * * 6') echo "beats=matchups hottake" >> $GITHUB_OUTPUT ;;
            '3 15 * * 0')  echo "beats=slate" >> $GITHUB_OUTPUT ;;
            '12 17 * * 0') echo "beats=inactives" >> $GITHUB_OUTPUT ;;
            *)             echo "beats=${{ github.event.inputs.beat || 'all' }}" >> $GITHUB_OUTPUT ;;
          esac

      # Real people don't post on the exact same minute every week. Slide the chatter beats by a
      # random 0-30 minutes so the channel reads organic instead of clockwork. Skip the jitter for
      # the two time-critical Sunday beats (the slate and the pre-kickoff inactives) — those have to
      # land before the games, not whenever the dice say.
      - name: Organic jitter
        if: >-
          github.event_name == 'schedule' &&
          github.event.schedule != '3 15 * * 0' &&
          github.event.schedule != '12 17 * * 0'
        run: sleep $(( (RANDOM % 31) * 60 ))

      - name: Run pulse
        env:
          PULSE_WEBHOOK_GENERAL:   ${{ secrets.PULSE_WEBHOOK_GENERAL }}
          PULSE_WEBHOOK_CROWNVEST: ${{ secrets.PULSE_WEBHOOK_CROWNVEST }}
          PULSE_WEBHOOK_TRADE:     ${{ secrets.PULSE_WEBHOOK_TRADE }}
          PULSE_WEBHOOK_HOTTAKE:   ${{ secrets.PULSE_WEBHOOK_HOTTAKE }}
          DISCORD_BOT_TOKEN:       ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID:        ${{ secrets.DISCORD_GUILD_ID }}
          DRY: ${{ github.event.inputs.dry }}
        run: |
          FLAG=""
          if [ "$DRY" = "true" ]; then FLAG="--dry"; fi
          for b in ${{ steps.pick.outputs.beats }}; do
            if [ "$b" = "all" ]; then
              node tools/pulse.mjs --all $FLAG
            else
              node tools/pulse.mjs --beat "$b" $FLAG
            fi
          done
