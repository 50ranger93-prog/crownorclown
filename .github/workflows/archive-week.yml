name: Archive the week

# The Gameday section reads live from ESPN, so once a week rolls over it is gone. This writes
# each week down into weeks/<season>/ and commits it, which is what the site's week picker
# reads back.
#
# It runs every morning, and that is the point rather than an accident.
#
# ESPN only carries a forecast while a game is still to be played. The moment it goes final
# the weather is gone from the scoreboard and from the summary, and nothing will give it back.
# The matchup predictor goes the same way, and so do the questionables — by Tuesday every one
# of them has been resolved, so the injury report the week was actually played under no longer
# exists anywhere. A once-a-week job would have caught Sunday's games and thrown away
# Thursday night's forecast before anyone ever saw it.
#
# So: a daily pass captures whatever is still capturable and merges it into the week's file,
# and a Tuesday pass settles the week just played with its scores and box scores.
#
# Times are UTC. Mountain is UTC-6 in season (MDT).

on:
  schedule:
    - cron: '0 15 * * *'    # every day 09:00 MT — forecasts, lines and the injury report,
                            # while the games they belong to are still ahead of us
    - cron: '0 16 * * 2'    # Tue 10:00 MT — the settled week, with results
  workflow_dispatch:
    inputs:
      week:
        description: 'NFL week to archive (leave "auto" for the settled week)'
        required: false
        default: 'auto'
      depthOnly:
        description: 'Only rebuild depth.json'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The daily pass wants the week currently being played ("upcoming"); the Tuesday settle
      # wants the one that just finished ("auto"). Both can land on a Tuesday and that is
      # fine — they write different files.
      - name: Work out which week
        id: which
        run: |
          MANUAL="${{ github.event.inputs.week }}"
          if [ -n "$MANUAL" ] && [ "$MANUAL" != "auto" ]; then
            echo "week=$MANUAL" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 16 * * 2" ]; then
            echo "week=auto" >> "$GITHUB_OUTPUT"
          else
            echo "week=upcoming" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh depth charts
        run: node tools/archive-week.mjs --week "${{ steps.which.outputs.week }}" --depth-only

      - name: Archive the week
        if: ${{ github.event.inputs.depthOnly != 'true' }}
        run: node tools/archive-week.mjs --week "${{ steps.which.outputs.week }}"

      - name: Commit anything that changed
        run: |
          git config user.name  "crownorclown-bot"
          git config user.email "bot@crownorclown.com"
          git add weeks
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Archive the week: $(date -u +%Y-%m-%d)"
            git push
          fi
